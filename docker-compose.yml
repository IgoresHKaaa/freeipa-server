services:
  freeipa:
    image: freeipa/freeipa-server:rocky-9-4.13.1
    container_name: freeipa-server
    hostname: ${IPA_HOSTNAME}

    network_mode: host
    read_only: true

    tty: true
    stdin_open: true

    environment:
      PASSWORD: ${IPA_ADMIN_PASSWORD}
      IPA_SERVER_INSTALL_OPTS: >-
        -U
        --realm=${IPA_REALM}
        --domain=${IPA_DOMAIN}
        --hostname=${IPA_HOSTNAME}
        --admin-password=${IPA_ADMIN_PASSWORD}
        --ds-password=${IPA_DS_PASSWORD}
        --ip-address=${IPA_IP}
        --no-host-dns
        --no-ssh
        --no-sshd
        --no-ntp

    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ./ipa-data:/data

    tmpfs:
      - /run
