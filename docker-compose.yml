services:
  freeipa:
    image: freeipa/freeipa-server:rocky-9-4.13.1
    container_name: freeipa-server
    hostname: ${IPA_HOSTNAME}
    restart: unless-stopped

    tty: true
    stdin_open: true

    ports:
      - "8443:443"
      - "389:389"
      - "636:636"
      - "88:88"
      - "88:88/udp"
      - "464:464"
      - "464:464/udp"
      - "53:53"
      - "53:53/udp"
      - "123:123/udp"

    environment:
      PASSWORD: ${IPA_ADMIN_PASSWORD}
      IPA_SERVER_INSTALL_OPTS: >-
        -U
        --realm=${IPA_REALM}
        --domain=${IPA_DOMAIN}
        --hostname=${IPA_HOSTNAME}
        --admin-password=${IPA_ADMIN_PASSWORD}
        --ds-password=${IPA_DS_PASSWORD}
        --ip-address=${IPA_IP}
        --no-host-dns
        --no-ssh
        --no-sshd
        --no-ntp

    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ./ipa-data:/data

    tmpfs:
      - /run
